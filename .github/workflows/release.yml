name: Build Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      linux_only:
        description: 'Only build Linux (x86_64 + ARM64) packages'
        type: boolean
        default: false
      macos_only:
        description: 'Only build macOS Universal (10.15+) packages'
        type: boolean
        default: false
      release_tag:
        description: 'Optional tag label for artifact naming (e.g. v4.7.0)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.linux_only || inputs.macos_only)) }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (Windows x64 - 65% Classic Installer)
        run: npm run tauri -- build --bundles nsis

      - name: Package Windows assets (installer + portable)
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { 'latest' }
          $ver = $tag.TrimStart('v')

          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found under bundle/nsis" }
          Copy-Item $nsis.FullName "KuroCat-$ver-x64-setup.exe"

          # 裸 exe 即绿色版。文件名必须以 -windows-x64.exe 结尾，
          # updater.rs 的 detect_install_kind/select_asset 据此判定便携模式。
          $bare = "src-tauri/target/release/KuroCat.exe"
          if (-not (Test-Path $bare)) { throw "portable exe not found at $bare" }
          Copy-Item $bare "KuroCat-$ver-windows-x64.exe"

          # 再打一个 zip：浏览器容易直接拦截无签名 exe，压缩包至少能先落地
          $stage = "portable-stage"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $bare "$stage/KuroCat.exe"
          $lines = @(
            'KuroCat 绿色免安装版 v' + $ver,
            '',
            '用法',
            '  1. 解压到任意可写的文件夹（不要放 C:\Program Files，那里没有写权限）。',
            '  2. 双击 KuroCat.exe 即可运行。',
            '  3. 设置、皮肤、输入记录都会自动生成在同目录的 data 文件夹里。',
            '',
            '数据位置',
            '  默认：与本 exe 同级的 data\',
            '  若该目录不可写：%APPDATA%\kuro-cat-pet\（与安装版相同）',
            '',
            '卸载',
            '  关闭程序，直接删掉整个文件夹即可，不写注册表、不留残留。',
            '  注意：data 文件夹里有全部设置和输入记录，删之前请确认。',
            '',
            '系统要求',
            '  Windows 10 1803 及以上 / Windows 11。',
            '  需要 Microsoft Edge WebView2 运行时（Win11 与近年 Win10 已内置）。',
            '  若提示缺少 WebView2，请安装：https://go.microsoft.com/fwlink/p/?LinkId=2124703',
            '',
            '首次运行会弹出 SmartScreen 提示（未签名的开源程序），',
            '点“更多信息” → “仍要运行” 即可。'
          )
          ($lines -join "`r`n") | Set-Content -Path "$stage/README.txt" -Encoding utf8
          Compress-Archive -Path "$stage/*" -DestinationPath "KuroCat-$ver-windows-x64.zip" -Force

          Get-ChildItem "KuroCat-$ver-*" |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-windows-x64
          path: |
            KuroCat-*-x64-setup.exe
            KuroCat-*-windows-x64.exe
            KuroCat-*-windows-x64.zip

      - name: Publish Windows assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            KuroCat-*-x64-setup.exe
            KuroCat-*-windows-x64.exe
            KuroCat-*-windows-x64.zip

  build-macos:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.linux_only) }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable (Apple Silicon + Intel Universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Universal macOS .app
        run: npm run tauri -- build --target universal-apple-darwin --bundles app

      - name: Package Universal macOS .dmg and .app.tar.gz
        run: |
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v ]]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v$(node -p "require('./package.json').version")"
            fi
          fi
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/KuroCat.app"
          test -d "$APP_PATH"
          echo "=== Verify macOS minimum version & Universal slices ==="
          plutil -p "$APP_PATH/Contents/Info.plist" | grep -i MinimumSystemVersion || true
          lipo -info "$APP_PATH/Contents/MacOS/KuroCat"
          otool -arch x86_64 -l "$APP_PATH/Contents/MacOS/KuroCat" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" || true
          otool -arch arm64 -l "$APP_PATH/Contents/MacOS/KuroCat" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" || true
          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "KuroCat" -srcfolder dmg_staging -ov -format UDZO "KuroCat-${TAG}-macos-universal.dmg"
          tar -czf "KuroCat-${TAG}-macos-universal.app.tar.gz" -C "src-tauri/target/universal-apple-darwin/release/bundle/macos" "KuroCat.app"
          ls -lh "KuroCat-${TAG}-macos-universal.dmg" "KuroCat-${TAG}-macos-universal.app.tar.gz"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-macos-universal
          path: |
            KuroCat-*-macos-universal.dmg
            KuroCat-*-macos-universal.app.tar.gz

      - name: Publish macOS assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            KuroCat-*-macos-universal.dmg
            KuroCat-*-macos-universal.app.tar.gz

  build-linux:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.macos_only) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Run Linux Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Linux .deb (KylinOS / Ubuntu / Debian / UOS)
        run: npm run tauri -- build --bundles deb

      - name: Build Tauri Linux .AppImage (best-effort)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          npm run tauri -- build --bundles appimage || echo "AppImage bundle skipped on ${{ matrix.arch }}"

      - name: Smoke-test Linux binary and inspect ELF / .deb metadata
        run: |
          BIN="src-tauri/target/release/KuroCat"
          test -x "$BIN"
          echo "=== Dynamic libraries ==="
          ldd "$BIN"
          echo "=== Max GLIBC symbols required ==="
          objdump -T "$BIN" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -n 10
          echo "=== MCP stdio live smoke test ==="
          RESP=$(printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}\n' | "$BIN" --mcp)
          echo "$RESP"
          echo "$RESP" | grep -q '"name":"kurocat"'
          echo "=== DEB metadata ==="
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          dpkg-deb -I "$DEB"

      - name: Rename Linux packages
        shell: bash
        run: |
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v ]]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v$(node -p "require('./package.json').version")"
            fi
          fi
          ARCH="${{ matrix.arch }}"
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          cp "$DEB" "KuroCat-${TAG}-linux-${ARCH}.deb"
          APPIMG=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n 1 || true)
          if [[ -n "$APPIMG" && -f "$APPIMG" ]]; then
            cp "$APPIMG" "KuroCat-${TAG}-linux-${ARCH}.AppImage"
          fi
          ls -lh KuroCat-${TAG}-linux-${ARCH}.*

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-linux-${{ matrix.arch }}
          path: |
            KuroCat-*-linux-${{ matrix.arch }}.deb
            KuroCat-*-linux-${{ matrix.arch }}.AppImage

      - name: Publish Linux assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            KuroCat-*-linux-${{ matrix.arch }}.deb
            KuroCat-*-linux-${{ matrix.arch }}.AppImage
